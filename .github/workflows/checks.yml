name: PR checks
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline application script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/kanji-inline.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/kanji-inline.js
      - name: Test KANJIDIC conversion
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test Kanjipedia parser
        run: node --test tests/*.test.mjs
      - name: Install test-only HTML parser
        run: npm install --no-save --no-package-lock --ignore-scripts linkedom@0.18.12
      - name: Test Wiktionary section discovery and image identity
        run: node --test tests/historical.spec.mjs tests/gallery.spec.mjs

      - name: Install Chromium for one-off visual smoke test
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Preview consolidated gallery in mobile Chromium
        run: node tests/visual-smoke.mjs
      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-gallery-mobile
          path: test-output/historical-gallery.png
          if-no-files-found: ignore
